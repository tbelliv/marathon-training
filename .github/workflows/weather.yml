name: Moab weather (Open-Meteo)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"   # 06:15 MDT daily

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch Open-Meteo forecast for the course start (38.416, -109.464, ~5,400 ft)
        run: |
          set -e
          mkdir -p canyonlands-2026/weather
          BASE="https://api.open-meteo.com/v1/forecast?latitude=38.4163&longitude=-109.4639&elevation=1645"
          HOURLY="temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation,precipitation_probability,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,soil_moisture_0_to_1cm,shortwave_radiation"
          DAILY="temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset"
          curl -sSf "${BASE}&hourly=${HOURLY}&daily=${DAILY}&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America/Denver&forecast_days=16&models=best_match" -o canyonlands-2026/weather/latest.json
          curl -sSf "${BASE}&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_direction_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America/Denver&forecast_days=16&models=gfs_seamless,ecmwf_ifs025,icon_seamless,gem_seamless" -o canyonlands-2026/weather/models.json
          cp canyonlands-2026/weather/latest.json "canyonlands-2026/weather/$(date -u +%Y-%m-%d).json"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canyonlands-2026/weather
          git diff --cached --quiet || git commit -m "weather: Open-Meteo pull $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
